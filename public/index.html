<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Server Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E9CB0'/%3E%3Cpath d='M9 16h4l2-5 4 10 2-5h2' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
  <script src="js/locale-guard.js" defer></script>
  <script src="vendor/uplot/uPlot.iife.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Barra lateral">
      <div class="brand">
        <div class="brand-text">
          <h1>Server Dashboard</h1>
          <span class="subtitle" id="hostLabel">—</span>
        </div>
      </div>
      <nav class="nav" aria-label="Telas" id="nav"></nav>
      <div class="sidebar-footer">
        <button id="pollBtn" type="button" title="Coletar agora (C)">Coletar agora</button>
      </div>
    </aside>
    <button class="nav-scrim" id="navScrim" aria-label="Fechar navegação" tabindex="-1"></button>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="navToggle" class="btn-icon nav-toggle" aria-label="Abrir navegação" aria-expanded="false" aria-controls="sidebar">☰</button>
          <h2 id="viewTitle">Visão geral</h2>
        </div>
        <div class="topbar-meta">
          <span class="status-pill" id="statusPill" role="status" aria-live="polite"><span class="dot" id="statusDot"></span><span id="statusText">conectando…</span></span>
          <span class="meta-item"><span class="label">Última coleta</span><span id="lastPoll">—</span></span>
          <div class="period-toggle" id="periodToggle" role="group" aria-label="Período dos gráficos"></div>
          <button id="themeToggle" class="btn-icon" type="button" title="Alternar tema (T)" aria-label="Alternar tema claro/escuro">◐</button>
        </div>
      </header>
      <div id="offlineBanner" class="offline-banner" role="alert" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="login" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <form class="modal-box login-form" id="loginForm">
      <div class="modal-head"><h3 id="loginTitle">Entrar no painel</h3></div>
      <div class="modal-body">
        <p>Cole o token de acesso (<code>DASH_TOKEN</code> do arquivo <code>.env</code>). Ele é pedido
        uma vez por navegador; a sessão vale 30 dias e se renova com o uso.</p>
        <label for="loginToken">Token de acesso</label>
        <input id="loginToken" name="token" type="password" autocomplete="current-password" required>
        <p id="loginError" class="login-error" role="alert"></p>
      </div>
      <div class="modal-foot"><button type="submit" id="loginSubmit">Entrar</button></div>
    </form>
  </div>
</body>
</html>
