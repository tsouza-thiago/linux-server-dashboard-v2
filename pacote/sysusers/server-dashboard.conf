# Usuário e grupos do pacote .deb (F9 etapa 6, ADR 0042 itens 2 e 5 e ADR 0046).
# No pacote: /usr/lib/sysusers.d/server-dashboard.conf, aplicado pelo systemd-sysusers na instalação.
#
# server-dashboard: grupo das pessoas que podem pedir a troca de versão pelo polkit
#   (pacote/polkit/50-server-dashboard.rules). Começa vazio; a instalação põe a pessoa nele.
# _server-dashboard: usuário de sistema do executor (pacote/systemd/), sem senha, sem login
#   (/usr/sbin/nologin) e com a pasta pessoal "/". O "u" cria também o grupo de mesmo nome, usado no
#   Group= das unidades. Ele NÃO entra no grupo server-dashboard: o executor nunca pede nada ao polkit.
g server-dashboard - -
u _server-dashboard - "Server Dashboard - executor de atualizacoes" - -
