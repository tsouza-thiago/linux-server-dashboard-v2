<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" role="img" aria-label="Diagrama: o painel roda no seu computador e faz 1 comando SSH de leitura por minuto no servidor Linux" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0F8F85"/></marker></defs>
  <rect x="1" y="1" width="598" height="260" rx="14" fill="none" stroke="#D0D7DE" stroke-dasharray="6 5"/>
  <text x="24" y="30" font-size="14" font-weight="600" fill="#59636E">SEU COMPUTADOR (127.0.0.1)</text>
  <rect x="24" y="48" width="170" height="190" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="109" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Navegador</text>
  <text x="109" y="102" text-anchor="middle" font-size="13" fill="#59636E">8 telas e gráficos</text>
  <text x="109" y="122" text-anchor="middle" font-size="13" fill="#59636E">zoom e filtros</text>
  <text x="109" y="142" text-anchor="middle" font-size="13" fill="#59636E">relatórios</text>
  <text x="109" y="162" text-anchor="middle" font-size="13" fill="#59636E">tudo roda aqui</text>
  <rect x="226" y="48" width="164" height="190" rx="10" fill="#F6F8FA" stroke="#0F8F85" stroke-width="2"/>
  <text x="308" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Painel</text>
  <text x="308" y="102" text-anchor="middle" font-size="13" fill="#59636E">coleta 1 vez por min</text>
  <text x="308" y="122" text-anchor="middle" font-size="13" fill="#59636E">calcula as taxas</text>
  <text x="308" y="142" text-anchor="middle" font-size="13" fill="#59636E">avalia os alertas</text>
  <text x="308" y="162" text-anchor="middle" font-size="13" fill="#59636E">serve as telas</text>
  <rect x="422" y="48" width="154" height="190" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="499" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Pasta data/</text>
  <text x="499" y="102" text-anchor="middle" font-size="13" fill="#59636E">72 h detalhadas</text>
  <text x="499" y="122" text-anchor="middle" font-size="13" fill="#59636E">90 dias resumidos</text>
  <text x="499" y="142" text-anchor="middle" font-size="13" fill="#59636E">alertas e quedas</text>
  <text x="499" y="162" text-anchor="middle" font-size="13" fill="#59636E">só neste computador</text>
  <rect x="696" y="48" width="160" height="190" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="776" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Servidor Linux</text>
  <text x="776" y="102" text-anchor="middle" font-size="13" fill="#59636E">nada instalado</text>
  <text x="776" y="122" text-anchor="middle" font-size="13" fill="#59636E">só leitura</text>
  <text x="776" y="142" text-anchor="middle" font-size="13" fill="#59636E">responde em ~1 s</text>
  <text x="776" y="162" text-anchor="middle" font-size="13" fill="#59636E">usuário dashmon</text>
  <path d="M226 143H196" stroke="#0F8F85" stroke-width="2" marker-end="url(#s)"/>
  <path d="M390 143H420" stroke="#0F8F85" stroke-width="2" marker-end="url(#s)"/>
  <path d="M576 143H694" stroke="#0F8F85" stroke-width="2.5" marker-start="url(#s)" marker-end="url(#s)"/>
  <text x="636" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#0F8F85">1 SSH por min</text>
  <text x="636" y="168" text-anchor="middle" font-size="12" fill="#59636E">só leitura</text>
</svg>
