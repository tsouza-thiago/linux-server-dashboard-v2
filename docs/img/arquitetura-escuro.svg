<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" role="img" aria-label="Diagrama: o painel roda no seu computador e faz 1 comando SSH de leitura por minuto no servidor Linux" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#3EE0D0"/></marker></defs>
  <rect x="1" y="1" width="598" height="260" rx="14" fill="none" stroke="#30363D" stroke-dasharray="6 5"/>
  <text x="24" y="30" font-size="14" font-weight="600" fill="#9DA7B3">SEU COMPUTADOR (127.0.0.1)</text>
  <rect x="24" y="48" width="170" height="190" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="109" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#E6EDF3">Navegador</text>
  <text x="109" y="102" text-anchor="middle" font-size="13" fill="#9DA7B3">8 telas e gráficos</text>
  <text x="109" y="122" text-anchor="middle" font-size="13" fill="#9DA7B3">zoom e filtros</text>
  <text x="109" y="142" text-anchor="middle" font-size="13" fill="#9DA7B3">relatórios</text>
  <text x="109" y="162" text-anchor="middle" font-size="13" fill="#9DA7B3">tudo roda aqui</text>
  <rect x="226" y="48" width="164" height="190" rx="10" fill="#161B22" stroke="#3EE0D0" stroke-width="2"/>
  <text x="308" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#E6EDF3">Painel</text>
  <text x="308" y="102" text-anchor="middle" font-size="13" fill="#9DA7B3">coleta 1 vez por min</text>
  <text x="308" y="122" text-anchor="middle" font-size="13" fill="#9DA7B3">calcula as taxas</text>
  <text x="308" y="142" text-anchor="middle" font-size="13" fill="#9DA7B3">avalia os alertas</text>
  <text x="308" y="162" text-anchor="middle" font-size="13" fill="#9DA7B3">serve as telas</text>
  <rect x="422" y="48" width="154" height="190" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="499" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#E6EDF3">Pasta data/</text>
  <text x="499" y="102" text-anchor="middle" font-size="13" fill="#9DA7B3">72 h detalhadas</text>
  <text x="499" y="122" text-anchor="middle" font-size="13" fill="#9DA7B3">90 dias resumidos</text>
  <text x="499" y="142" text-anchor="middle" font-size="13" fill="#9DA7B3">alertas e quedas</text>
  <text x="499" y="162" text-anchor="middle" font-size="13" fill="#9DA7B3">só neste computador</text>
  <rect x="696" y="48" width="160" height="190" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="776" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#E6EDF3">Servidor Linux</text>
  <text x="776" y="102" text-anchor="middle" font-size="13" fill="#9DA7B3">nada instalado</text>
  <text x="776" y="122" text-anchor="middle" font-size="13" fill="#9DA7B3">só leitura</text>
  <text x="776" y="142" text-anchor="middle" font-size="13" fill="#9DA7B3">responde em ~1 s</text>
  <text x="776" y="162" text-anchor="middle" font-size="13" fill="#9DA7B3">usuário dashmon</text>
  <path d="M226 143H196" stroke="#3EE0D0" stroke-width="2" marker-end="url(#s)"/>
  <path d="M390 143H420" stroke="#3EE0D0" stroke-width="2" marker-end="url(#s)"/>
  <path d="M576 143H694" stroke="#3EE0D0" stroke-width="2.5" marker-start="url(#s)" marker-end="url(#s)"/>
  <text x="636" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#3EE0D0">1 SSH por min</text>
  <text x="636" y="168" text-anchor="middle" font-size="12" fill="#9DA7B3">só leitura</text>
</svg>
